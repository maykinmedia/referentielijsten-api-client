interactions:
- request:
    body: null
    headers:
      Accept:
      - '*/*'
      Accept-Encoding:
      - gzip, deflate
      Connection:
      - keep-alive
      User-Agent:
      - python-requests/2.32.5
    method: HEAD
    uri: http://localhost:8004/api/v1/
  response:
    body:
      string: ''
    headers:
      API-version:
      - 0.2.0
      Allow:
      - GET, HEAD, OPTIONS
      Content-Length:
      - '97'
      Content-Security-Policy:
      - 'img-src ''self'' data: cdn.redoc.ly; base-uri ''self''; font-src ''self''
        fonts.gstatic.com; form-action ''self''; default-src ''self''; style-src ''self''
        ''unsafe-inline'' fonts.googleapis.com; worker-src ''self'' blob:; script-src
        ''self'' ''unsafe-inline''; object-src ''none''; frame-src ''self''; frame-ancestors
        ''none'''
      Content-Type:
      - application/json
      Cross-Origin-Opener-Policy:
      - same-origin
      Referrer-Policy:
      - same-origin
      Vary:
      - origin
      X-Content-Type-Options:
      - nosniff
      X-Frame-Options:
      - DENY
    status:
      code: 200
      message: OK
version: 1
