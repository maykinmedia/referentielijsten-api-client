interactions:
- request:
    body: null
    headers:
      Accept:
      - '*/*'
      Accept-Encoding:
      - gzip, deflate
      Connection:
      - keep-alive
      User-Agent:
      - python-requests/2.32.5
    method: HEAD
    uri: http://localhost:8004/api/v1/
  response:
    body:
      string: ''
    headers:
      API-version:
      - 0.2.0
      Allow:
      - GET, HEAD, OPTIONS
      Content-Length:
      - '97'
      Content-Security-Policy:
      - 'font-src ''self'' fonts.gstatic.com; frame-src ''self''; form-action ''self'';
        base-uri ''self''; script-src ''self'' ''unsafe-inline''; frame-ancestors
        ''none''; default-src ''self''; worker-src ''self'' blob:; style-src ''self''
        ''unsafe-inline'' fonts.googleapis.com; object-src ''none''; img-src ''self''
        data: cdn.redoc.ly'
      Content-Type:
      - application/json
      Cross-Origin-Opener-Policy:
      - same-origin
      Referrer-Policy:
      - same-origin
      Vary:
      - origin
      X-Content-Type-Options:
      - nosniff
      X-Frame-Options:
      - DENY
    status:
      code: 200
      message: OK
version: 1
